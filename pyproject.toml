[project]
name = "starglob-datalab"
version = "0.3.1"
description = "Generador y auditor de datos sintéticos para pruebas de software"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "faker",
    "pyyaml",
    "pydantic",
    "streamlit",
    "plotly",
]

[project.optional-dependencies]
dev = ["pytest", "coverage"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]