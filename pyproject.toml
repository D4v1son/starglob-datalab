[project]
name = "starglob-datalab"
version = "0.1.0"
description = "Generador y auditor de datos sintéticos para pruebas de software"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "faker",
    "pyyaml",
    "pydantic",
    "streamlit",
    "plotly",
]

[project.optional-dependencies]
dev = ["pytest", "coverage"]

[tool.pytest.ini_options]
pythonpath = ["src"]